{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | {{ tienda_nombre }}</title>
    <meta name="description" content="Revisa tu carrito y envía tu pedido por WhatsApp.">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/inicio/carrito.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/navbarprincipal.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/footerprincipal.css' %}">
</head>
<body>
    {% include 'componentes/navbarprincipal.html' %}

    <main class="cart-page container py-4">
        <section class="cart-hero">
            <div class="cart-hero-card bg-white p-3 rounded shadow-sm">
                <div class="cart-header-panel d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="eyebrow">Tu carrito</span>
                        <h1 class="h4">Revisa tu pedido</h1>
                        <p class="small text-muted">Ajusta cantidades, elimina productos y envía tu pedido por WhatsApp cuando estés listo.</p>
                    </div>
                    <div class="cart-actions-top">
                        <a href="{% url 'index' %}" class="btn btn-link">Seguir comprando</a>
                        <button id="clearCartBtn" class="btn btn-outline-danger">Vaciar carrito</button>
                    </div>
                </div>
                <div id="cartContent" class="cart-content mb-3"></div>
                <div class="cart-summary d-flex justify-content-between align-items-center">
                    <div>
                        <small class="text-muted">Total</small>
                        <div class="h5">Bs <span id="cartTotal">0.00</span></div>
                    </div>
                    <button id="checkoutButton" data-phone="{{ tienda_whatsapp|slice:'1:' }}" class="btn btn-success">Enviar pedido por WhatsApp</button>
                </div>
            </div>
        </section>
    </main>

    {% include 'componentes/footerprincipal.html' %}

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{% static 'js/componentes/navbarprincipal.js' %}"></script>
    <script src="{% static 'js/inicio/carrito.js' %}"></script>
</body>
</html>
