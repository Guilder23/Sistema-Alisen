{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | {{ tienda_nombre }}</title>
    <meta name="description" content="Revisa tu carrito y envía tu pedido por WhatsApp.">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/navbarprincipal.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes/footerprincipal.css' %}">
    <link rel="stylesheet" href="{% static 'css/inicio/carrito.css' %}">
</head>
<body>
    {% include 'componentes/navbarprincipal.html' %}

    <main class="cart-page container py-4">
        <section class="cart-hero bg-white rounded shadow-sm p-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <span class="eyebrow text-uppercase text-muted">Tu carrito</span>
                    <h1 class="h4 mt-2">Revisa tu pedido</h1>
                    <p class="text-muted mb-0">Ajusta cantidades, elimina productos y envía tu pedido por WhatsApp.</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-sm">Seguir comprando</a>
                    <button id="clearCartBtn" class="btn btn-outline-danger btn-sm">Vaciar carrito</button>
                </div>
            </div>

            <div id="cartContent" class="cart-content"></div>

            <div class="cart-summary bg-light rounded p-3 mt-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                <div>
                    <span class="text-muted">Total</span>
                    <div class="h4 mb-0">Bs <span id="cartTotal">0.00</span></div>
                </div>
                <button id="checkoutButton" data-phone="{{ tienda_whatsapp|slice:'1:' }}" class="btn btn-success btn-sm">Enviar pedido por WhatsApp</button>
            </div>
        </section>
    </main>

    {% include 'componentes/footerprincipal.html' %}

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{% static 'js/componentes/navbarprincipal.js' %}"></script>
    <script src="{% static 'js/inicio/cart.js' %}"></script>
</body>
</html>
