<div class="modal fade" id="modalCrearSubcategoria" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg modal-dialog-centered" role="document"><div class="modal-content">
		<div class="modal-header"><h5 class="modal-title"><i class="fas fa-layer-group"></i> Crear Nueva Subcategoría</h5><button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button></div>
		<form id="formCrearSubcategoria" method="post" action="{% url 'subcategorias:crear' %}">{% csrf_token %}
			<div class="modal-body">
				<div class="form-group"><label for="crearSubCategoria" class="form-label">Categoría <span class="text-danger">*</span></label><select name="categoria" id="crearSubCategoria" class="form-control" required><option value="">Seleccione una categoría</option>{% for categoria in categorias %}<option value="{{ categoria.id }}">{{ categoria.nombre }}</option>{% endfor %}</select></div>
				<div class="form-group"><label for="crearSubNombre" class="form-label">Nombre <span class="text-danger">*</span></label><input name="nombre" id="crearSubNombre" class="form-control" required maxlength="100" placeholder="Ingrese el nombre de la subcategoría"></div>
				<div class="form-group"><label for="crearSubDescripcion" class="form-label">Descripción</label><textarea name="descripcion" id="crearSubDescripcion" class="form-control" rows="4" placeholder="Descripción opcional"></textarea></div>
				<div class="form-group mb-0"><div class="custom-control custom-checkbox"><input type="checkbox" class="custom-control-input" id="crearSubActiva" name="activo" checked><label class="custom-control-label" for="crearSubActiva"><strong>Subcategoría Activa</strong></label></div></div>
			</div>
			<div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal"><i class="fas fa-times"></i> Cancelar</button><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar Subcategoría</button></div>
		</form>
	</div></div>
</div>
