<div class="modal fade" id="modalEditarSubcategoria" tabindex="-1" role="dialog"><div class="modal-dialog modal-lg modal-dialog-centered" role="document"><div class="modal-content">
	<div class="modal-header"><h5 class="modal-title"><i class="fas fa-edit"></i> Editar Subcategoría</h5><button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button></div>
	<form id="formEditarSubcategoria" method="post">{% csrf_token %}<input type="hidden" id="editarSubcategoriaId" name="subcategoria_id"><div class="modal-body"><div class="form-group"><label for="editarSubCategoria" class="form-label">Categoría <span class="text-danger">*</span></label><select name="categoria" id="editarSubCategoria" class="form-control" required>{% for categoria in categorias %}<option value="{{ categoria.id }}">{{ categoria.nombre }}</option>{% endfor %}</select></div><div class="form-group"><label for="editarSubNombre" class="form-label">Nombre <span class="text-danger">*</span></label><input name="nombre" id="editarSubNombre" class="form-control" required maxlength="100"></div><div class="form-group"><label for="editarSubDescripcion" class="form-label">Descripción</label><textarea name="descripcion" id="editarSubDescripcion" class="form-control" rows="4"></textarea></div><div class="form-group mb-0"><div class="custom-control custom-checkbox"><input type="checkbox" class="custom-control-input" id="editarSubActiva" name="activo"><label class="custom-control-label" for="editarSubActiva"><strong>Subcategoría Activa</strong></label></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal"><i class="fas fa-times"></i> Cancelar</button><button type="submit" class="btn btn-warning"><i class="fas fa-save"></i> Guardar Cambios</button></div></form>
</div></div></div>
