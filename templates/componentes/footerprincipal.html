{% load static %}
<footer class="footer-principal py-5">
  <div class="container">
    <div class="row align-items-start">
      <div class="col-md-5 mb-4 mb-md-0">
        <img src="{% static 'img/logoAlmacen.png' %}" alt="Alicen" class="footer-logo-principal">
      </div>
      <div class="col-md-4 mb-4 mb-md-0">
        <h6 class="footer-heading">Enlaces rápidos</h6>
        <ul class="footer-links list-unstyled">
          <li><a href="{% url 'index' %}">Inicio</a></li>
          <li><a href="#productos">Productos</a></li>
          <li><a href="{% url 'nosotros' %}">Nosotros</a></li>
          <li><a href="{% url 'preguntas_frecuentes' %}">Preguntas frecuentes</a></li>
          <li><a href="{% url 'carrito' %}">Carrito</a></li>
          <li><a href="{% url 'login' %}">Iniciar sesión</a></li>
        </ul>
      </div>
      <div class="col-md-3">
        <h6 class="footer-heading">Contacto</h6>
        <p class="footer-text mb-1">WhatsApp: +591 68504229</p>
        <p class="footer-text mb-1">Email: {{ tienda_email }}</p>
        <p class="footer-text">Dirección: {{ tienda_direccion }}</p>
      </div>
    </div>
    <div class="footer-bottom text-center mt-4">
      <span>© 2026 {{ tienda_nombre }}. Todos los derechos reservados.</span>
    </div>
  </div>
</footer>
