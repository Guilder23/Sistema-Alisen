{% load static %}
<link rel="stylesheet" href="{% static 'css/reportes/reportesproductosventas/modal/modal_exportar.css' %}">

<div class="modal fade" id="modalExportar" tabindex="-1" role="dialog" aria-labelledby="modalExportarLabel">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header" style="background-color: #1cc88a; color: white;">
                <h5 class="modal-title" id="modalExportarLabel">
                    <i class="fas fa-file-excel"></i> Exportar a Excel
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p class="mb-3"><strong>Selecciona las columnas que deseas exportar:</strong></p>
                <div class="row">
                    <div class="col-12 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="colTodas" onchange="seleccionarTodasColumnas(this.checked)">
                            <label class="custom-control-label font-weight-bold" for="colTodas">
                                <i class="fas fa-check-double"></i> Seleccionar Todas
                            </label>
                        </div>
                    </div>
                </div>
                <hr class="my-2">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colCodigo" value="0" checked>
                            <label class="custom-control-label" for="colCodigo">Código</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colNombre" value="1" checked>
                            <label class="custom-control-label" for="colNombre">Producto</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colCategoria" value="2" checked>
                            <label class="custom-control-label" for="colCategoria">Categoría</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colGenero" value="3" checked>
                            <label class="custom-control-label" for="colGenero">Género</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colPrecioCompra" value="4" checked>
                            <label class="custom-control-label" for="colPrecioCompra">Precio Compra</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colCantidad" value="5" checked>
                            <label class="custom-control-label" for="colCantidad">Cantidad Vendida</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colCajas" value="6" checked>
                            <label class="custom-control-label" for="colCajas">Cajas</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colPrecioPromedio" value="7" checked>
                            <label class="custom-control-label" for="colPrecioPromedio">Precio Promedio</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colCostoTotal" value="8" checked>
                            <label class="custom-control-label" for="colCostoTotal">Costo Total</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colVentas" value="9" checked>
                            <label class="custom-control-label" for="colVentas">Ventas Totales</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colUtilidad" value="10" checked>
                            <label class="custom-control-label" for="colUtilidad">Utilidad</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colMargen" value="11" checked>
                            <label class="custom-control-label" for="colMargen">Margen %</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input columna-exportar" id="colNumVentas" value="12" checked>
                            <label class="custom-control-label" for="colNumVentas">N° Ventas</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" class="btn btn-success" onclick="confirmarExportacion()">
                    <i class="fas fa-file-download"></i> Exportar
                </button>
            </div>
        </div>
    </div>
</div>
