<!-- MODAL: CREAR PRODUCTO -->
<div class="modal fade" id="modalCrearProducto" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-plus"></i> Crear Nuevo Producto
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="formCrearProducto" method="post" action="{% url 'crear_producto' %}" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <!-- COLUMNA IZQUIERDA -->
                        <div class="col-md-6">
                            <h6 class="text-muted mb-3">
                                <i class="fas fa-info-circle"></i> Información del Producto
                            </h6>
                            
                            <div class="form-group">
                                <label for="codigo" class="form-label">Código <span class="text-danger">*</span></label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="codigo" 
                                    name="codigo" 
                                    required
                                    placeholder="Ej: PROD-001"
                                >
                            </div>

                            <div class="form-group">
                                <label for="categoria" class="form-label">Categoría <span class="text-danger">*</span></label>
                                <select class="form-control" id="categoria" name="categoria" required>
                                    <option value="">Seleccione una categoría</option>
                                    {% for categoria in categorias %}
                                        <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="subcategoria" class="form-label">Subcategoría <span class="text-danger">*</span></label>
                                <select class="form-control" id="subcategoria" name="subcategoria" required>
                                    <option value="">Seleccione una subcategoría</option>
                                    {% for subcategoria in subcategorias %}
                                        <option value="{{ subcategoria.id }}" data-categoria="{{ subcategoria.categoria_id }}">{{ subcategoria.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="nombre" 
                                    name="nombre" 
                                    required
                                    placeholder="Nombre del producto"
                                >
                            </div>

                            <div class="form-group">
                                <label for="descripcion" class="form-label">Detalle/Descripción</label>
                                <textarea 
                                    class="form-control" 
                                    id="descripcion" 
                                    name="descripcion"
                                    rows="3"
                                    placeholder="Descripción del producto"
                                ></textarea>
                            </div>

                            <div class="form-group">
                                {% include 'productos/componentes/galeria_imagenes_form.html' with video_input_id='video_youtube' %}
                            </div>
                        </div>

                        <!-- COLUMNA DERECHA -->
                        <div class="col-md-6">
                            <h6 class="text-muted mb-3">
                                <i class="fas fa-sliders-h"></i> Configuración
                            </h6>

                            <div class="form-group">
                                <label for="unidades_por_caja" class="form-label">Unidades x Caja <span class="text-danger">*</span></label>
                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="unidades_por_caja" 
                                    name="unidades_por_caja" 
                                    required
                                    value="1"
                                    min="1"
                                >
                            </div>

                            <div class="form-group">
                                <label for="unidades_por_mayor" class="form-label">Unidades por mayor <span class="text-danger">*</span></label>
                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="unidades_por_mayor" 
                                    name="unidades_por_mayor" 
                                    required
                                    value="3"
                                    min="2"
                                >
                                <small class="form-text text-muted">Desde cuántas unidades se considera venta por mayor</small>
                            </div>

                            <h6 class="text-muted mb-3 mt-4">
                                <i class="fas fa-exclamation-triangle"></i> Niveles de Stock
                            </h6>

                            <div class="form-group">
                                <label for="stock_critico" class="form-label">Stock Crítico</label>
                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="stock_critico" 
                                    name="stock_critico" 
                                    value="10"
                                    min="0"
                                >
                                <small class="form-text text-muted">Alertará cuando stock sea menor o igual</small>
                            </div>

                            <div class="form-group">
                                <label for="stock_bajo" class="form-label">Stock Bajo</label>
                                <input 
                                    type="number" 
                                    class="form-control" 
                                    id="stock_bajo" 
                                    name="stock_bajo" 
                                    value="30"
                                    min="0"
                                >
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
