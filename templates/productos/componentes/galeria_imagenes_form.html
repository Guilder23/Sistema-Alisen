<div class="form-group galeria-producto-form">
    <label class="form-label">
        <i class="fas fa-images"></i> Imágenes del producto
    </label>
    <div class="galeria-existentes mb-2"></div>
    <div class="galeria-preview mb-2"></div>
    <input type="file" name="imagenes" class="input-imagenes d-none" accept="image/*" multiple>
    <input type="hidden" name="imagen_principal_id" class="imagen-principal-id" value="">
    <input type="hidden" name="imagen_principal_nueva" class="imagen-principal-nueva" value="0">
    <button type="button" class="btn btn-outline-secondary btn-sm btn-agregar-imagenes">
        <i class="fas fa-plus"></i> Agregar imágenes
    </button>
    <small class="form-text text-muted d-block mt-1">
        Puedes subir varias imágenes. Marca una como principal para la tienda.
    </small>
</div>
<div class="form-group">
    <label class="form-label" for="{{ video_input_id|default:'video_youtube' }}">
        <i class="fab fa-youtube text-danger"></i> Video de YouTube
    </label>
    <input
        type="text"
        class="form-control input-video-youtube"
        id="{{ video_input_id|default:'video_youtube' }}"
        name="video_youtube"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
    >
    <small class="form-text text-muted">Opcional. Se mostrará en el detalle del producto.</small>
</div>
