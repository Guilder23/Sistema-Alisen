services:
  - type: web
    name: sistema-alicen
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: gunicorn sistemaInventario.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-alicen-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DELETE_SALES_ON_DEPLOY
        value: "true"

databases:
  - name: sistema-alicen-db
    databaseName: sistema_inventario
    user: postgres
